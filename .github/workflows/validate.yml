name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skill layout and frontmatter
        run: python3 scripts/validate.py
      - name: Exercise each skill's coverage script against its example register
        run: |
          for s in skills/*/*/scripts/check_coverage.py; do
            d="$(dirname "$(dirname "$s")")"
            python3 -I "$s" "$d/assets/security-requirements.example.json" "$(mktemp -d)" --report-only
          done
